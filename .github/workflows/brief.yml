# Builds the evening brief in the cloud: downloads the day's NSE files,
# updates the forward log, commits data/user back to the repo and publishes
# the app to Cloudflare Pages.
#
# The scripts use only Node built-ins, so there is no install step. Downloaded
# NSE files are kept in the Actions cache; a normal night fetches one session.
name: Evening brief

on:
  schedule:
    # 19:30 IST, after NSE publishes; 22:00 IST catches a late publication. Mon-Fri.
    - cron: "0 14 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

# Publishing to Cloudflare is skipped until both secrets exist.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore downloaded NSE files
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: nse-raw-${{ github.run_id }}
          restore-keys: nse-raw-
      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Fetch the watchlist and screens saved from the hosted app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p data/user
          for name in watchlist screens; do
            if npx wrangler kv key get "$name" --binding USER --remote > "/tmp/$name.json" 2>/dev/null \
              && node -e "JSON.parse(require('fs').readFileSync('/tmp/$name.json', 'utf8'))" 2>/dev/null; then
              cp "/tmp/$name.json" "data/user/$name.json"
              echo "$name: taken from the hosted app"
            else
              echo "$name: nothing saved in the hosted app yet, using the repo copy"
            fi
          done
      - name: Build the brief
        run: node scripts/brief.mjs
      - name: Save downloaded NSE files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: nse-raw-${{ github.run_id }}
      - name: Commit the log and brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/user
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            asof=$(node -p "require('./public/data/brief.json').asOf")
            git commit -q -m "Brief for $asof"
            git pull -q --rebase
            git push -q
          fi
      - name: Publish the app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name nse-screener --branch main --commit-dirty=true
      - name: Keep the generated app data
        uses: actions/upload-artifact@v4
        with:
          name: app-data
          path: |
            public/data/brief.json
            public/data/screener.json
          retention-days: 7
